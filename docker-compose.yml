services:
  rembg:
    image: danielgatis/rembg:latest
    container_name: prohub-rembg
    command: ["s"]
    ports:
      - "8080:7000"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G

  video-worker:
    build:
      context: ./video-worker
      dockerfile: Dockerfile
    container_name: prohub-video-worker
    ports:
      - "8090:8090"
    environment:
      - VIDEO_WORKER_DATA=/app/data
      - VIDEO_WORKER_MAX_UPLOAD_BYTES=2147483648
      - VIDEO_WORKER_CORS_ORIGINS=http://localhost:3000
      - WHISPER_MODEL_DIR=/models/faster-whisper
    volumes:
      - video-worker-data:/app/data
      - ./models/faster-whisper:/models/faster-whisper:ro
    restart: unless-stopped

  prohub:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prohub
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - CHROME_PATH=/usr/bin/chromium-browser
      - HEADLESS=true
      - REMBG_URL=http://rembg:7000
      - VIDEO_WORKER_URL=http://video-worker:8090
      - SMTP_HOST=${SMTP_HOST:-smtp.qq.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_SECURE=${SMTP_SECURE:-true}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - FEEDBACK_FROM=${FEEDBACK_FROM:-}
      - REMBG_MODEL=isnet-general-use
      - ADMIN_USERNAME=${ADMIN_USERNAME:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    restart: unless-stopped
    depends_on:
      - rembg
      - video-worker

volumes:
  video-worker-data:





