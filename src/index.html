<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>proHub - 全能工具箱</title>
  <meta name="description" content="proHub 全能工具箱 - 社交媒体解析下载、文本处理、实用计算等一站式在线工具集合" />
  <meta name="keywords" content="proHub,工具箱,在线工具,无水印下载,抖音解析,小红书解析,微博解析" />
  <meta name="author" content="proHub" />
  <meta name="robots" content="index, follow" />
  <meta name="referrer" content="no-referrer" />
  <script>
    (() => {
      try {
        const stored = localStorage.getItem('prohub-theme');
        const legacyDark = localStorage.getItem('prohub-dark');
        const mode = stored === 'light' || stored === 'dark' || stored === 'system'
          ? stored
          : legacyDark === 'true'
            ? 'dark'
            : legacyDark === 'false'
              ? 'light'
              : 'system';
        const dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      } catch {}
    })();
    // 同步恢复壁纸：在首屏渲染前设好 CSS 变量，避免"先闪太空壁纸再变用户壁纸"
    (() => {
      try {
        const raw = localStorage.getItem('prohub-background');
        if (!raw) return;
        let bg;
        try { bg = JSON.parse(raw); } catch { return; }
        if (!bg || typeof bg !== 'object') return;
        const root = document.documentElement.style;
        if (bg.imageUrl) {
          root.setProperty('--prohub-background-image', 'url("' + bg.imageUrl + '")');
          root.setProperty('--prohub-background-color', bg.color || '#111827');
        } else if (bg.color) {
          root.setProperty('--prohub-background-image', 'none');
          root.setProperty('--prohub-background-color', bg.color);
        }
      } catch {}
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
